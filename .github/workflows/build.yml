name: Test and build download

# Every push: run the tests, build the download package and the Windows
# .exe files, and publish them on the "latest" release page so testers
# can always download the newest tested build.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Engine selftest
        run: python fwaudit.py selftest
      - name: Web end-to-end test
        run: python tests/test_web.py

  package:
    name: Build ZIP package
    needs: test
    runs-on: ubuntu-22.04
    outputs:
      name: ${{ steps.pkg.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pkg
        name: Build package
        run: |
          p=$(python tools/make_package.py dist)
          echo "path=$p" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$p" .zip)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/*.zip
          retention-days: 30

  windows-exe:
    name: Build Windows .exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller==6.11.1
          pyinstaller --onefile --name fwaudit fwaudit.py
          pyinstaller --onefile --name PolicyPulse-web --hidden-import fwaudit_web_ui fwaudit_web.py
      - name: Smoke-test the .exe
        shell: pwsh
        run: |
          .\dist\fwaudit.exe selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\dist\PolicyPulse-web.exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Zip
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0,7)
          Copy-Item README.md dist\
          Compress-Archive -Path dist\fwaudit.exe, dist\PolicyPulse-web.exe, dist\README.md -DestinationPath "PolicyPulse-windows-exe-$sha.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: PolicyPulse-windows-exe
          path: PolicyPulse-windows-exe-*.zip
          retention-days: 30

  publish:
    name: Publish "latest" download
    needs: [package, windows-exe]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Update the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l out
          sha=$(echo "$GITHUB_SHA" | cut -c1-7)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.zip \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest tested build ($GITHUB_REF_NAME @ $sha)" \
            --notes "Built automatically after the tests passed on Windows and Linux (Python 3.8 and 3.12).

          * **PolicyPulse-<version>-$sha.zip** - Python files + double-click start files (needs Python 3.8+).
          * **PolicyPulse-windows-exe-$sha.zip** - fwaudit.exe (desktop + command line) and PolicyPulse-web.exe; no Python needed.

          Commit: $GITHUB_SHA on $GITHUB_REF_NAME. VERSION.txt inside the ZIP lists the SHA-256 of every file."
